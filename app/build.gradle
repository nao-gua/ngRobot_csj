plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.chzu.ngRobot_csj'
    compileSdk 34

    // 其他配置...
    buildFeatures {
        buildConfig = true // 启用 BuildConfig 生成
    }

    defaultConfig {
        applicationId "com.chzu.ngRobot_csj"
        minSdk 25
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            // 设置支持的SO库架构
//            abiFilters 'arm64-v8a'
            abiFilters 'armeabi-v7a', 'arm64-v8a'
//            abiFilters 'armeabi-v7a'
        }

        buildTypes {
            release {
                minifyEnabled false
                proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            }
            debug {
                minifyEnabled false
                proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            }
        }

        buildConfigField 'String', 'ROBOT_TYPE_DEF_TIMO', '"Timo"'
        buildConfigField 'String', 'ROBOT_TYPE_DEF_TIMO_i18n', '"Timo_i18n"'
    }



    productFlavors {
        flavorDimensions 'default'
        Timo_i18n {
            buildConfigField 'String', 'robotType', '"Timo_i18n"'
            manifestPlaceholders = [app_name: "Reception"]
        }
        Timo {
            buildConfigField 'String', 'robotType', '"Timo"'
            manifestPlaceholders = [app_name    : "Reception"]
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation project(':newSceneSDK')

    implementation 'androidx.multidex:multidex:2.0.0'
    implementation 'io.netty:netty-all:4.1.23.Final'
    implementation 'com.google.code.gson:gson:2.8.1'

    implementation "com.squareup.retrofit2:retrofit:2.3.0"
    implementation "io.reactivex.rxjava2:rxjava:2.2.6"
    implementation "com.squareup.retrofit2:adapter-rxjava2:2.3.0"
    implementation "com.squareup.retrofit2:converter-gson:2.3.0"
    implementation "io.reactivex.rxjava2:rxandroid:2.1.0"
}